<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12100d">
<title>My Music</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Music">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+Thai:wght@400;500;600&family=Noto+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12100d; --bg2:#1a1713; --panel:#1f1b16; --line:#3a3227; --line2:#2a241d;
  --text:#efe7d8; --muted:#a39886; --faint:#6f6658;
  --gold:#c9a45c; --gold2:#e3c98f;
  --serif:"Cormorant Garamond","Noto Serif Thai",Georgia,serif;
  --thai-serif:"Noto Serif Thai","Cormorant Garamond",serif;
  --sans:"Noto Sans Thai",-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);background-image:radial-gradient(ellipse 80% 50% at 50% -10%,#2a2218 0%,transparent 70%);background-attachment:fixed;color:var(--text);font-family:var(--sans);font-weight:300;min-height:100vh;padding-bottom:200px;letter-spacing:.01em}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit}
svg{display:block}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* Header */
header{padding:28px 0 18px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line2)}
header .avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--panel);border:1px solid var(--gold);padding:2px}
header .who small{display:block;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
header .who h1{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.1;margin-top:2px}
.brand{margin-left:auto;text-align:right}
.brand b{font-family:var(--serif);font-style:italic;font-weight:500;font-size:22px;color:var(--gold2);display:block;line-height:1}
.logout{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.logout:hover{color:var(--gold2)}

/* Section titles */
.sec{display:flex;align-items:center;gap:14px;margin:34px 0 18px}
.sec h2{font-family:var(--thai-serif);font-weight:500;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.sec .orn{color:var(--gold);font-size:12px}
.sec .side{order:3;font-size:12px;color:var(--muted);white-space:nowrap}

/* Cover tiles */
.row{display:flex;gap:18px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;scroll-snap-type:x proximity}
.row::-webkit-scrollbar{display:none}
.tile{flex:0 0 150px;width:150px;min-width:0;text-align:left;scroll-snap-align:start;cursor:pointer}
.cover{width:100%;aspect-ratio:1/1;overflow:hidden;background:var(--panel);border:1px solid var(--line);position:relative}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.tile:hover .cover img,.gtile:hover .cover img{transform:scale(1.04)}
.cover::after{content:"";position:absolute;inset:6px;border:1px solid transparent;transition:border-color .3s}
.tile:hover .cover::after,.gtile:hover .cover::after{border-color:rgba(227,201,143,.55)}
.tile b,.gtile b{display:block;font-family:var(--thai-serif);font-weight:500;font-size:14px;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span,.gtile span{font-size:12px;color:var(--muted);display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px}
.gtile{text-align:left;min-width:0}
.round .cover,.round .cover::after{border-radius:50%}
.round{text-align:center}
.round .rank{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:15px;display:block;margin-top:8px}
.round b{margin-top:2px}

/* Track list */
.list{display:flex;flex-direction:column;border-top:1px solid var(--line2)}
.track{display:grid;grid-template-columns:28px 52px 1fr 36px;align-items:center;gap:14px;padding:11px 0 11px 6px;text-align:left;width:100%;border-bottom:1px solid var(--line2);transition:background .2s;cursor:pointer}
.track:hover{background:rgba(201,164,92,.06)}
.track .no{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--faint);text-align:right}
.track img{width:52px;height:52px;object-fit:cover;background:var(--panel);border:1px solid var(--line)}
.track .ti{min-width:0}
.track b{display:block;font-family:var(--thai-serif);font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .ti span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-top:2px}
.track.playing b{color:var(--gold2)}
.track.playing .no{color:var(--gold)}
.more{width:36px;height:36px;display:grid;place-items:center;color:var(--faint)}
.more:hover{color:var(--gold2)}

.back{color:var(--gold);margin:26px 0 0;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.search{width:100%;padding:14px 4px;border:none;border-bottom:1px solid var(--line);background:transparent;color:var(--text);margin-top:30px;font-family:var(--thai-serif);font-size:20px;outline:none}
.search:focus{border-color:var(--gold)}
.search::placeholder{color:var(--faint)}
.empty{color:var(--muted);font-size:14px;padding:14px 0;font-style:italic}
.note{border-left:2px solid var(--gold);padding:10px 14px;color:var(--muted);font-size:13px;line-height:1.7;margin:16px 0;background:rgba(201,164,92,.05)}
.loadmore{display:block;margin:22px auto 0;color:var(--gold2);font-size:12px;letter-spacing:.18em;text-transform:uppercase;border-bottom:1px solid var(--line);padding:6px 2px}

/* Buttons */
.btn{border:1px solid var(--gold);color:var(--gold2);padding:12px 30px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;transition:all .25s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{background:var(--gold);color:var(--bg)}
.btn.solid{background:var(--gold);color:var(--bg)}
.btn.solid:hover{background:var(--gold2)}
.btn.sm{padding:9px 18px;font-size:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.seg{display:inline-flex;border:1px solid var(--line);margin-top:6px}
.seg button{padding:8px 16px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--gold);color:var(--bg)}

/* Playlist header */
.phead{display:flex;gap:22px;align-items:flex-end;margin-top:22px}
.phead .cover{width:150px;flex:none}
.phead small{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.phead h2{font-family:var(--thai-serif);font-weight:500;font-size:28px;line-height:1.3;margin:4px 0}
.phead p{color:var(--muted);font-size:13px}
@media (max-width:560px){.phead{flex-direction:column;align-items:flex-start}.phead .cover{width:60%;max-width:220px}}

/* Welcome / setup */
.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.mark{font-family:var(--serif);font-style:italic;font-size:54px;color:var(--gold2);line-height:1}
.rule{width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px auto}
.center p{color:var(--muted);line-height:1.8;max-width:420px;margin:0 auto 28px}
.link{color:var(--muted);font-size:12px;letter-spacing:.1em;margin-top:18px}
.setup{background:var(--bg2);border:1px solid var(--line);padding:26px;text-align:left;max-width:460px;width:100%;line-height:1.8;font-size:14px}
.setup h3{font-family:var(--thai-serif);font-weight:500;font-size:17px;margin-bottom:8px;color:var(--gold2)}
.setup ol{padding-left:20px;color:var(--muted)}
.setup ol b{color:var(--text);font-weight:500}
.setup code{background:var(--panel);padding:2px 6px;word-break:break-all;color:var(--gold2);font-size:12px}
.field{width:100%;padding:12px 2px;border:none;border-bottom:1px solid var(--line);background:transparent;color:var(--text);margin:18px 0 22px;outline:none}
.field:focus{border-color:var(--gold)}
.setup .btn{width:100%}
.notice{border:1px solid #6b5426;color:var(--gold2);padding:12px 14px;font-size:13px;margin-top:20px;background:rgba(201,164,92,.06)}

/* Player bar */
#player{position:fixed;left:0;right:0;bottom:64px;background:rgba(22,19,15,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:5}
#player .wrap{padding-top:12px;padding-bottom:10px}
#player .top{display:flex;align-items:center;gap:14px}
#player .meta{display:flex;align-items:center;gap:14px;flex:1;min-width:0;cursor:pointer;text-align:left}
#pImg{width:50px;height:50px;object-fit:cover;background:var(--panel);border:1px solid var(--gold);padding:2px;flex:none}
#player .info{flex:1;min-width:0}
#player .info b{display:block;font-family:var(--thai-serif);font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .info span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pDev{color:var(--gold)!important;font-size:11px!important}
.ctrl{display:flex;gap:4px;align-items:center}
.ib{width:40px;height:40px;display:grid;place-items:center;color:var(--text);transition:color .2s;position:relative}
.ib:hover{color:var(--gold2)}
.ib.dim{color:var(--faint)}
.ib.on{color:var(--gold2)}
.ib.on::after{content:"";position:absolute;bottom:5px;left:50%;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:var(--gold)}
.ib .one{position:absolute;top:6px;right:6px;font-size:9px;font-family:var(--serif);color:var(--gold2)}
.pp{width:46px;height:46px;border:1px solid var(--gold);border-radius:50%;color:var(--gold2);display:grid;place-items:center;transition:all .2s}
.pp:hover{background:var(--gold);color:var(--bg)}
.bar{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:13px;color:var(--muted);margin-top:8px}
.vwrap{display:flex;align-items:center;gap:8px;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:18px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line)}
input[type=range]::-moz-range-track{height:1px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--gold2);margin-top:-5px;border:none}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--gold2);border:none}
.prog{background:linear-gradient(var(--gold),var(--gold)) 0 50%/var(--p,0%) 1px no-repeat}
.vol{flex:none;width:80px}
.hide-sm{display:none}

/* Nav */
nav{position:fixed;left:0;right:0;bottom:0;height:64px;background:#0d0b09;display:flex;border-top:1px solid var(--line2);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;font-size:10.5px;letter-spacing:.06em;color:var(--faint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:color .2s;position:relative}
nav button.on{color:var(--gold2)}
nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:1px;background:var(--gold)}

/* Now playing overlay */
#np{position:fixed;inset:0;z-index:20;background:var(--bg);background-image:radial-gradient(ellipse 90% 60% at 50% 0%,#2e251a 0%,transparent 70%);overflow-y:auto;transform:translateY(100%);transition:transform .35s ease;visibility:hidden}
#np.open{transform:none;visibility:visible}
.np-in{max-width:1120px;margin:0 auto;padding:18px 22px calc(40px + env(safe-area-inset-bottom))}
.np-top{display:flex;align-items:center;justify-content:space-between}
.np-top small{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);text-align:center}
.np-main{max-width:440px;margin:0 auto}
.np-cover{margin:22px auto 0;width:100%;aspect-ratio:1/1;border:1px solid var(--gold);padding:6px;background:var(--panel)}
.np-cover img{width:100%;height:100%;object-fit:cover;display:block;background:var(--bg2)}
.np-meta{display:flex;align-items:flex-start;gap:12px;margin-top:24px}
.np-meta div{flex:1;min-width:0}
.np-meta h2{font-family:var(--thai-serif);font-weight:500;font-size:24px;line-height:1.35}
.np-meta p{color:var(--muted);margin-top:4px}
.np-times{display:flex;justify-content:space-between;font-family:var(--serif);font-size:13px;color:var(--muted);margin-top:2px}
#npSeek{width:100%;margin-top:18px}
.np-ctrl{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.np-ctrl .pp{width:64px;height:64px}
.np-vol{display:flex;align-items:center;gap:10px;color:var(--muted);margin-top:14px}
.np-tabs{display:flex;gap:26px;margin-top:34px;border-bottom:1px solid var(--line2)}
.np-tabs button{padding:10px 0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);position:relative}
.np-tabs button.on{color:var(--gold2)}
.np-tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--gold)}
#npPanel{border-top:none}
.dev{display:flex;align-items:center;gap:14px;padding:14px 6px;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.dev:hover{background:rgba(201,164,92,.06)}
.dev b{font-family:var(--thai-serif);font-weight:500;display:block}
.dev span{font-size:12px;color:var(--muted)}
.dev.active b,.dev.active svg{color:var(--gold2)}
@media (min-width:900px){
  .np-grid{display:grid;grid-template-columns:440px 1fr;gap:60px;margin-top:10px}
  .np-main{margin:0}
  .np-tabs{margin-top:22px}
}

/* Sheet & toast */
#sheet{position:fixed;inset:0;z-index:30;display:none}
#sheet.open{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.6)}
#sheet .sh{position:absolute;left:0;right:0;bottom:0;max-height:80vh;overflow-y:auto;background:var(--bg2);border-top:1px solid var(--gold);padding:18px 20px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh-head{display:flex;gap:14px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line2);margin-bottom:6px}
.sh-head img{width:54px;height:54px;object-fit:cover;border:1px solid var(--line);background:var(--panel)}
.sh-head div{min-width:0}
.sh-head b{font-family:var(--thai-serif);font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-head span{font-size:12px;color:var(--muted)}
.sh-btn{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;text-align:left;border-bottom:1px solid var(--line2);font-size:15px}
.sh-btn:hover{color:var(--gold2)}
.sh-btn svg{color:var(--gold)}
.sh-btn small{margin-left:auto;color:var(--faint);font-size:12px}
.sh-title{font-family:var(--thai-serif);font-weight:500;font-size:17px;color:var(--gold2);margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);background:var(--panel);border:1px solid var(--gold);color:var(--gold2);padding:10px 18px;font-size:13px;z-index:40;opacity:0;pointer-events:none;transition:all .3s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#sheet.open ~ #toast{bottom:auto;top:calc(20px + env(safe-area-inset-top))}

@media (min-width:860px){
  body{padding-bottom:140px}
  nav{position:static;height:auto;background:none;border:none;justify-content:flex-start;gap:34px;padding:14px 0 0 20px;max-width:1120px;margin:0 auto}
  nav button{flex:none;flex-direction:row;gap:8px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;padding:8px 0}
  nav button.on::before{top:auto;bottom:0;left:0;right:0}
  #player{bottom:0}
  #player .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding-top:14px;padding-bottom:14px}
  #player .top{display:contents}
  .ctrl{justify-self:center}
  .bar{grid-column:1/-1;margin-top:0;order:3}
  .hide-sm{display:grid}
  .tile{flex-basis:170px;width:170px}
  .sec h2{font-size:22px}
  #toast{bottom:120px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"><div class="bd"></div><div class="sh" id="shBody"></div></div>
<div id="toast"></div>

<script>
/* =========================================================
   My Music — personal Spotify player (Web API, 2026 Dev Mode)
   ========================================================= */
const SCOPES = "user-read-private user-read-email playlist-read-private playlist-read-collaborative playlist-modify-private playlist-modify-public user-library-read user-library-modify user-read-recently-played user-top-read streaming user-read-playback-state user-modify-playback-state user-read-currently-playing";
const SCOPE_VER = "2";
const REDIRECT = location.origin + location.pathname;
const $ = s => document.querySelector(s);
const app = $("#app");
const store = {
  get: k => { try { return localStorage.getItem(k) } catch { return null } },
  set: (k,v) => { try { localStorage.setItem(k,v) } catch {} },
  del: k => { try { localStorage.removeItem(k) } catch {} }
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const img = (images) => images?.[images.length > 1 ? 1 : 0]?.url || "";
const bigImg = (images) => images?.[0]?.url || "";
const fmt = ms => { ms = Math.max(0, ms||0); const s = Math.floor(ms/1000); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0") };
const artistsOf = t => (t.artists||[]).map(a => a.name).join(", ");

const svg = (d, fill) => `<svg width="20" height="20" viewBox="0 0 24 24" ${fill ? 'fill="currentColor"' : 'fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"'}>${d}</svg>`;
const I = {
  home: svg('<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>'),
  lib: svg('<path d="M4 4v16M9 4v16M14 4l6 16"/>'),
  heart: svg('<path d="M12 20s-7-4.4-9-9a4.8 4.8 0 0 1 9-3 4.8 4.8 0 0 1 9 3c-2 4.6-9 9-9 9z"/>'),
  heartF: svg('<path d="M12 20s-7-4.4-9-9a4.8 4.8 0 0 1 9-3 4.8 4.8 0 0 1 9 3c-2 4.6-9 9-9 9z"/>', true),
  stats: svg('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
  search: svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>'),
  prev: svg('<path d="M6 5h1.5v14H6zM19 5v14L9 12z"/>', true),
  next: svg('<path d="M16.5 5H18v14h-1.5zM5 5v14l10-7z"/>', true),
  play: svg('<path d="M7 4v16l13-8z"/>', true),
  pause: svg('<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>', true),
  vol: svg('<path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/>'),
  shuffle: svg('<path d="M3 6h3.5c2 0 3.3 1 4.4 2.6l2.2 3.3c1.1 1.6 2.4 2.6 4.4 2.6H21M17 11.5l4 3-4 3M3 18h3.5c1.3 0 2.3-.4 3.1-1.1M14.4 7.1c.8-.7 1.8-1.1 3.1-1.1H21M17 3l4 3-4 3"/>'),
  repeat: svg('<path d="M4 11V9a3 3 0 0 1 3-3h13M17 3l3 3-3 3M20 13v2a3 3 0 0 1-3 3H4M7 21l-3-3 3-3"/>'),
  more: svg('<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>', true),
  queue: svg('<path d="M3 6h13M3 12h13M3 18h8M18 15v6M15 18h6"/>'),
  plus: svg('<path d="M12 5v14M5 12h14"/>'),

/* ---------- Auth (PKCE) ---------- */
function rand(n){ const a = new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a, b => ("0"+b.toString(16)).slice(-2)).join("") }
async function challenge(v){
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(v));
  return btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function login(){
  const v = rand(48); store.set("verifier", v);
  const p = new URLSearchParams({ client_id: store.get("client_id"), response_type:"code", redirect_uri: REDIRECT, scope: SCOPES, code_challenge_method:"S256", code_challenge: await challenge(v) });
  location.href = "https://accounts.spotify.com/authorize?" + p;
}
async function tokenRequest(body){
  const r = await fetch("https://accounts.spotify.com/api/token", { method:"POST", headers:{ "Content-Type":"application/x-www-form-urlencoded" }, body: new URLSearchParams(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error_description || j.error || "token error");
  store.set("access", j.access_token);
  if (j.refresh_token) store.set("refresh", j.refresh_token);
  store.set("expires", Date.now() + (j.expires_in - 60) * 1000);
}
async function handleCallback(){
  const q = new URLSearchParams(location.search);
  if (q.get("error")) { history.replaceState(null,"",REDIRECT); alert("เข้าสู่ระบบไม่สำเร็จ: " + q.get("error")); return }
  if (!q.get("code")) return;
  await tokenRequest({ grant_type:"authorization_code", code:q.get("code"), redirect_uri:REDIRECT, client_id:store.get("client_id"), code_verifier:store.get("verifier") });
  store.set("scope_ver", SCOPE_VER);
  history.replaceState(null,"",REDIRECT);
}
let refreshing = null;
async function token(){
  if (!store.get("access")) return null;
  if (Date.now() > +store.get("expires")) {
    refreshing ||= tokenRequest({ grant_type:"refresh_token", refresh_token:store.get("refresh"), client_id:store.get("client_id") }).finally(() => refreshing = null);
    try { await refreshing } catch { logout(); return null }
  }
  return store.get("access");
}
function logout(){ ["access","refresh","expires","verifier"].forEach(store.del); location.href = REDIRECT }

async function api(path, opts = {}){
  const t = await token(); if (!t) throw new Error("no token");
  const r = await fetch("https://api.spotify.com/v1" + path, { ...opts, headers:{ Authorization:"Bearer " + t, "Content-Type":"application/json", ...(opts.headers||{}) } });
  if (r.status === 204 || r.status === 202) return null;
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null } catch {}
  if (!r.ok) { const e = new Error(j?.error?.message || ("HTTP " + r.status)); e.status = r.status; throw e }
  return j;
}
/* Try newer 2026 endpoints first, fall back to older ones */
async function apiTry(list){
  let err;
  for (const [p, o] of list) {
    try { return await api(p, o) }
    catch (e) { err = e; if (![400,404,405,410].includes(e.status)) throw e }
  }
  throw err;
}

}
async function setSaved(uri, on){
  const method = on ? "PUT" : "DELETE";
  return apiTry([[`/me/library?uris=${enc(uri)}`, {method}], [`/me/tracks?ids=${uri.split(":").pop()}`, {method}]]);
}
async function getMyPlaylists(force){
  if (myPlaylists && !force) return myPlaylists;
  const out = []; let url = "/me/playlists?limit=50";
  for (let i = 0; i < 4 && url; i++) {
    const d = await api(url);
    (d.items||[]).filter(Boolean).forEach(p => { out.push(p); plCache[p.id] = p });
    url = d.next ? d.next.replace("https://api.spotify.com/v1", "") : null;
  }
  return myPlaylists = out;
}

function addSongsSheet(id){
  const p = plCache[id] || {};

  const done = new Set();
  sheet(`<div class="sh-title">เพิ่มเพลงลง “${esc(p.name)}”</div>
    <input class="field" id="addQ" placeholder="ค้นหาเพลง หรือศิลปิน…" autocomplete="off" style="margin:6px 0 8px">

    <button class="btn solid" style="width:100%;margin-top:18px" data-a="done">เสร็จ</button>`, a => { if (a === "done") finish() });
  const finish = () => { closeSheet(); if (added) refreshPlaylist(id) };
  $("#sheet .bd").onclick = finish;
  const res = $("#addRes");
  const draw = () => {
    res.innerHTML = items.length ? `<div class="list">${items.map(t => { remember(t); const ok = done.has(t.uri); return `<div class="track" style="grid-template-columns:52px 1fr 40px;cursor:default"><img src="${esc(img(t.album?.images))}" alt="" loading="lazy"><div class="ti"><b>${esc(t.name)}</b><span>${esc(artistsOf(t))}</span></div><button class="ib ${ok ? "on" : ""}" data-add="${esc(t.uri)}" aria-label="เพิ่ม">${ok ? I.check : I.plus}</button></div>` }).join("")}</div>`
      + (offset < Math.min(total, 100) ? '<button class="loadmore" id="addMore">แสดงเพิ่มอีก 10 เพลง</button>' : "")

      b.disabled = false;
    });
    if ($("#addMore")) $("#addMore").onclick = () => search(true);
  };
  const search = async more => {
    if (!more) { items = []; offset = 0 }

  };

  setTimeout(() => $("#addQ")?.focus(), 50);
}

/* ---------- Playback ---------- */
const targetDevice = () => (cur?.source === "api" && cur.deviceId) ? cur.deviceId : deviceId;
const isLocal = () => cur?.source === "sdk" && player;
function playErr(e){ toast(e.status === 403 ? "ต้องใช้ Spotify Premium เพื่อสั่งเล่นเพลง" : e.status === 404 ? "ไม่พบอุปกรณ์สำหรับเล่น ลองรีเฟรชหน้าเว็บ" : "เล่นไม่สำเร็จ: " + e.message) }
async function play(uri, uris, context){
  const dev = targetDevice(); if (!dev) return notice();
  const body = context ? { context_uri: context, offset: { uri } } : { uris: [...new Set(uris)].slice(0, 100), offset: { uri } };
  try { await api(`/me/player/play?device_id=${dev}`, { method:"PUT", body: JSON.stringify(body) }); pollSoon() } catch (e) { playErr(e) }
}
async function playContext(ctx, shuffle){
  const dev = targetDevice(); if (!dev) return notice();
  try {
    await api(`/me/player/play?device_id=${dev}`, { method:"PUT", body: JSON.stringify({ context_uri: ctx }) });
    await api(`/me/player/shuffle?state=${!!shuffle}&device_id=${dev}`, { method:"PUT" }).catch(() => {});
    if (shuffle) await api(`/me/player/next?device_id=${dev}`, { method:"POST" }).catch(() => {});
    pollSoon();
  } catch (e) { playErr(e) }
}
function playShuffled(uris){
  const a = [...uris]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] }
  play(a[0], a);
}
async function ctl(action, arg){
  try {
    if (action === "toggle") { if (isLocal()) return player.togglePlay(); if (!cur) return notice(); await api(cur.paused ? "/me/player/play" : "/me/player/pause", {method:"PUT"}); cur.paused = !cur.paused; paint() }
    if (action === "next") { if (isLocal()) return player.nextTrack(); await api("/me/player/next", {method:"POST"}) }
    if (action === "prev") { if (isLocal()) return player.previousTrack(); await api("/me/player/previous", {method:"POST"}) }
    if (action === "seek") { if (isLocal()) return player.seek(Math.round(arg)); await api(`/me/player/seek?position_ms=${Math.round(arg)}`, {method:"PUT"}) }
    if (action === "vol") { store.set("vol", arg); if (isLocal() || !cur) return player?.setVolume(arg/100); await api(`/me/player/volume?volume_percent=${arg}`, {method:"PUT"}) }
    if (action === "shuffle") { if (!cur) return; await api(`/me/player/shuffle?state=${!cur.shuffle}`, {method:"PUT"}); cur.shuffle = !cur.shuffle; paint(); toast(cur.shuffle ? "เปิดสุ่มเพลง" : "ปิดสุ่มเพลง") }
    if (action === "repeat") { if (!cur) return; const nx = {off:"context",context:"track",track:"off"}[cur.repeat || "off"]; await api(`/me/player/repeat?state=${nx}`, {method:"PUT"}); cur.repeat = nx; paint(); toast({off:"ปิดเล่นซ้ำ",context:"เล่นซ้ำทั้งรายการ",track:"เล่นซ้ำเพลงนี้"}[nx]) }
    pollSoon();
  } catch (e) { toast(e.status === 403 ? "อุปกรณ์นี้ไม่รองรับคำสั่งนี้" : "ทำไม่สำเร็จ: " + e.message) }
}
async function toggleLike(){
  if (!cur || liked === null) return;
  try { await setSaved(cur.uri, !liked); setLiked(!liked); toast(liked ? "เพิ่มในเพลงที่ถูกใจแล้ว" : "เอาออกจากเพลงที่ถูกใจแล้ว") } catch (e) { toast("ทำไม่สำเร็จ: " + e.message) }
}
function setLiked(v){ liked = v; const b = $("#npLike"); if (b) { b.innerHTML = v ? I.heartF : I.heart; b.classList.toggle("on", !!v) } }
function notice(){
  if ($(".notice") || !$("#main")) return;
  $("#main").insertAdjacentHTML("afterbegin", `<div class="notice">ตัวเล่นเพลงบนเว็บยังไม่พร้อม — ต้องใช้ Spotify Premium และเปิดผ่าน Safari หรือ Chrome หรือเลือกเล่นบนอุปกรณ์อื่นในหน้า “กำลังเล่น → อุปกรณ์”</div>`);
}
function highlight(){ document.querySelectorAll(".track").forEach(b => b.classList.toggle("playing", b.dataset.uri === cur?.uri)) }

/* Normalise state from the in-browser SDK or from the Web API (other devices) */
function fromSDK(s){
  const t = s.track_window.current_track;
  return { source:"sdk", uri:t.uri, id:t.id, name:t.name, artists:artistsOf(t), img:t.album?.images?.[0]?.url || "", paused:s.paused, position:s.position, duration:s.duration, shuffle:s.shuffle, repeat:["off","context","track"][s.repeat_mode] || "off", device:"เว็บนี้", deviceId };
}
function fromAPI(p){
  if (!p || !p.item) return null;
  const t = p.item;
  return { source:"api", uri:t.uri, id:t.id, name:t.name, artists:artistsOf(t) || t.show?.name || "", img:bigImg(t.album?.images || t.images), paused:!p.is_playing, position:p.progress_ms || 0, duration:t.duration_ms || 0, shuffle:p.shuffle_state, repeat:p.repeat_state || "off", device:p.device?.name || "", deviceId:p.device?.id, volume:p.device?.volume_percent };
}
function setCur(n){
  const changed = n?.uri !== cur?.uri;
  cur = n; paint();
  if (changed) {
    liked = null; setLiked(null);
    if (cur) { remember({ uri:cur.uri, id:cur.id, name:cur.name, artists:[{name:cur.artists}], album:{images:[{url:cur.img}]} }); isSaved([cur.uri]).then(r => { if (cur?.uri === n.uri) setLiked(!!r?.[0]) }).catch(() => {}) }
    if ($("#np")?.classList.contains("open")) loadNpPanel();
  }
}
function paint(){
  if (!$("#pName")) return;
  const c = cur;
  $("#pImg").src = c?.img || ""; $("#npImg").src = c?.img || "";
  $("#pName").textContent = c?.name || "ยังไม่ได้เล่นเพลง"; $("#npName").textContent = c?.name || "ยังไม่ได้เล่นเพลง";
  $("#pArt").textContent = c ? c.artists : "แตะเพลงเพื่อเริ่มเล่น"; $("#npArt").textContent = c?.artists || "";
  $("#pDev").textContent = c && c.source === "api" && c.device ? "▸ กำลังเล่นบน " + c.device : "";
  $("#npDev").textContent = c?.device ? (c.source === "sdk" ? "บนเว็บนี้" : "บน " + c.device) : "";
  const icon = c && !c.paused ? I.pause : I.play;
  $("#pp").innerHTML = icon; $("#npPP").innerHTML = icon;
  for (const id of ["shuf","npShuf"]) { const b = $("#"+id); b.classList.toggle("on", !!c?.shuffle); b.classList.toggle("dim", !c?.shuffle) }
  for (const id of ["rep","npRep"]) { const b = $("#"+id); const r = c?.repeat || "off"; b.classList.toggle("on", r !== "off"); b.classList.toggle("dim", r === "off"); b.innerHTML = I.repeat + (r === "track" ? '<span class="one">1</span>' : "") }
  if (c?.source === "api" && typeof c.volume === "number") for (const id of ["vol","npVol"]) { $("#"+id).value = c.volume; $("#"+id).style.setProperty("--p", c.volume + "%") }
  $("#pDur").textContent = fmt(c?.duration); $("#npDur").textContent = fmt(c?.duration);
  paintPos(); highlight(); mediaSession();
}
function paintPos(){
  const c = cur, p = c?.duration ? Math.min(1, c.position / c.duration) : 0;
  $("#pCur").textContent = fmt(c?.position); $("#npCur").textContent = fmt(c?.position);
  for (const id of ["seek","npSeek"]) { const s = $("#"+id); if (s && !s.dataset.drag) { s.value = p * 1000; s.style.setProperty("--p", p*100 + "%") } }
}
let msBound = false;
function mediaSession(){
  if (!("mediaSession" in navigator)) return;
  if (!msBound) {
    msBound = true;
    const h = { play:() => ctl("toggle"), pause:() => ctl("toggle"), previoustrack:() => ctl("prev"), nexttrack:() => ctl("next"), seekto:d => ctl("seek", d.seekTime * 1000) };
    for (const k in h) try { navigator.mediaSession.setActionHandler(k, h[k]) } catch {}
  }
  if (!cur) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title:cur.name, artist:cur.artists, album:"My Music", artwork: cur.img ? [{ src:cur.img, sizes:"640x640", type:"image/jpeg" }] : [] });
    navigator.mediaSession.playbackState = cur.paused ? "paused" : "playing";
  } catch {}
}

/* ---------- Web Playback SDK + remote polling ---------- */
async function pollRemote(){
  if (cur?.source === "sdk" && !cur.paused) return;
  try { const p = await api("/me/player"); const n = fromAPI(p); if (n && n.deviceId === deviceId && player) return; setCur(n) } catch {}
}
let pollT; function pollSoon(){ clearTimeout(pollT); pollT = setTimeout(pollRemote, 700) }
function initPlayer(){
  window.onSpotifyWebPlaybackSDKReady = () => {
    player = new Spotify.Player({ name:"My Music Web Player", getOAuthToken: async cb => cb(await token()), volume: (+store.get("vol") || 70) / 100 });
    player.addListener("ready", ({ device_id }) => { deviceId = device_id });
    player.addListener("not_ready", () => { deviceId = null });
    player.addListener("account_error", () => { player = null; notice() });
    player.addListener("initialization_error", () => { player = null });
    player.addListener("authentication_error", () => logout());
    player.addListener("player_state_changed", s => { if (!s) { if (cur?.source === "sdk") { cur = null; pollRemote() } return } setCur(fromSDK(s)) });
    player.connect();
  };
  const sc = document.createElement("script"); sc.src = "https://sdk.scdn.co/spotify-player.js"; document.body.appendChild(sc);
  const v = +store.get("vol") || 70; for (const id of ["vol","npVol"]) { $("#"+id).value = v; $("#"+id).style.setProperty("--p", v + "%") }
  setInterval(() => { if (cur && !cur.paused) { cur.position = Math.min(cur.position + 1000, cur.duration); paintPos() } }, 1000);
  setInterval(() => { if (!document.hidden) pollRemote() }, 5000);
  pollRemote();
}

/* ---------- Start ---------- */

  try { await handleCallback() } catch (e) { alert("เข้าสู่ระบบไม่สำเร็จ: " + e.message) }
  if (store.get("access") && store.get("scope_ver") !== SCOPE_VER) {
    ["access","refresh","expires"].forEach(store.del);
    return loginScreen("มีฟีเจอร์ใหม่ กรุณาเข้าสู่ระบบอีกครั้งเพื่ออนุญาตสิทธิ์เพิ่มเติม");
  }
  if (!(await token())) return loginScreen();
  try { me = await api("/me") } catch { return loginScreen() }
  shell(); render(); initPlayer();
})();
</script>
